<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的片单">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#2f6b4f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>我的片单</title>
<style>
/* 单列：顶部播放器，下方是自己的片单；没有任何推荐入口 */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #1d2420;
  --muted: #65706a;
  --line: #dde1dc;
  --accent: #2f6b4f;
  --accent-fg: #ffffff;
  --danger: #a33a2c;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614;
    --surface: #1b211e;
    --fg: #e6ebe7;
    --muted: #93a099;
    --line: #2b332f;
    --accent: #6fbf95;
    --accent-fg: #0d1a13;
    --danger: #e0806f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { padding-top: 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; margin: 0; letter-spacing: 0.02em; }
h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.player {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%;
  background: #000; border-radius: var(--radius); overflow: hidden;
}
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cover {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; background: var(--surface); color: var(--fg); text-align: center; padding: 16px;
}
.cover p { margin: 0; color: var(--muted); }
.now { font-weight: 600; min-height: 1.5em; }

button {
  font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; }
ul.list li { background: var(--surface); display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; align-items: center; padding: 10px; }
ul.list li.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.thumb { width: 112px; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--line) center / cover no-repeat; border: 0; padding: 0; }
.meta { min-width: 0; }
.meta .t { font-weight: 600; overflow-wrap: anywhere; cursor: pointer; }
.meta .s { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.del { border: 0; background: none; color: var(--danger); padding: 6px 8px; }
.empty { background: var(--surface); border-radius: var(--radius); padding: 20px; color: var(--muted); }

section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
textarea, input[type=text] {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px;
}
textarea { min-height: 84px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.msg { font-size: 13px; color: var(--accent); min-height: 1.2em; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
@media (max-width: 420px) {
  ul.list li { grid-template-columns: 88px 1fr auto; }
  .thumb { width: 88px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>我的片单</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="player" id="player">
    <div class="cover" id="cover">
      <p id="coverText">从下面的片单里选一个视频</p>
    </div>
  </div>
  <div class="now" id="now"></div>

  <div class="row" style="justify-content: space-between">
    <h2>片单</h2>
  </div>
  <ul class="list" id="list"></ul>

  <section class="panel">
    <h2>添加视频</h2>
    <textarea id="input" placeholder="粘贴 YouTube 链接，一行一个。支持视频链接、youtu.be 短链接、Shorts 链接和播放列表链接。&#10;可以在一行末尾加空格和标题，例如：&#10;https://youtu.be/xxxxxxxxxxx 线性代数第3讲"></textarea>
    <div class="row">
      <button class="primary" id="add">添加</button>
      <button id="export">复制全部链接（备份）</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="panel">
    <h2>屏蔽测试</h2>
    <p class="hint">在「屏幕使用时间」里屏蔽 youtube.com 之后，分别切到两种播放方式各播一次，看哪种还能播放。</p>
    <div class="row">
      <div class="seg" role="group" aria-label="播放器域名">
        <button id="modeA" data-host="www.youtube-nocookie.com">youtube-nocookie.com</button>
        <button id="modeB" data-host="www.youtube.com">youtube.com</button>
      </div>
    </div>
    <p class="hint" id="modeNote"></p>
  </section>
</main>

<script>
(function () {
  var KEY = 'myvideos.list.v1';
  var MODE_KEY = 'myvideos.host.v1';
  var EXAMPLE = [{ kind: 'video', id: 'jNQXAC9IVRw', title: '示例：Me at the zoo（YouTube 上第一个视频，测试用，可删除）' }];

  function load(k, fallback) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var items = load(KEY, null) || EXAMPLE.slice();
  var host = load(MODE_KEY, 'www.youtube-nocookie.com');
  var current = -1;

  var $ = function (id) { return document.getElementById(id); };

  // 从各种 YouTube 链接里取出视频 ID 或播放列表 ID
  function parse(line) {
    line = line.trim();
    if (!line) return null;
    var parts = line.split(/\s+/);
    var raw = parts[0];
    var title = parts.slice(1).join(' ');
    if (/^[\w-]{11}$/.test(raw)) return { kind: 'video', id: raw, title: title };
    var u;
    try { u = new URL(/^https?:\/\//.test(raw) ? raw : 'https://' + raw); } catch (e) { return null; }
    var h = u.hostname.replace(/^(www|m|music)\./, '');
    var id = null;
    if (h === 'youtu.be') id = u.pathname.slice(1, 12);
    else if (/youtube(-nocookie)?\.com$/.test(h)) {
      id = u.searchParams.get('v');
      var m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/);
      if (!id && m) id = m[2];
      var list = u.searchParams.get('list');
      if (!id && list) return { kind: 'playlist', id: list, title: title };
    }
    if (id && /^[\w-]{11}$/.test(id)) return { kind: 'video', id: id, title: title };
    return null;
  }

  function linkOf(it) {
    return it.kind === 'playlist'
      ? 'https://www.youtube.com/playlist?list=' + it.id
      : 'https://youtu.be/' + it.id;
  }

  function render() {
    var ul = $('list');
    ul.innerHTML = '';
    $('count').textContent = items.length + ' 个';
    if (!items.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.style.display = 'block';
      li.textContent = '片单是空的。在下面粘贴 YouTube 链接添加。';
      ul.appendChild(li);
      return;
    }
    items.forEach(function (it, i) {
      var li = document.createElement('li');
      if (i === current) li.className = 'active';
      var th = document.createElement('button');
      th.className = 'thumb';
      th.setAttribute('aria-label', '播放');
      if (it.kind === 'video') th.style.backgroundImage = 'url(https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg)';
      th.onclick = function () { play(i); };
      var meta = document.createElement('div');
      meta.className = 'meta';
      var t = document.createElement('div');
      t.className = 't';
      t.textContent = it.title || (it.kind === 'playlist' ? '播放列表' : '未命名视频');
      t.onclick = function () { play(i); };
      var s = document.createElement('div');
      s.className = 's';
      s.textContent = (it.kind === 'playlist' ? '播放列表 · ' : '') + it.id;
      meta.appendChild(t); meta.appendChild(s);
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '删除';
      del.onclick = function () { askDelete(del, i); };
      li.appendChild(th); li.appendChild(meta); li.appendChild(del);
      ul.appendChild(li);
    });
  }

  // 页面里不能用 confirm()，所以点两下才删除
  function askDelete(btn, i) {
    if (btn.dataset.armed) {
      items.splice(i, 1);
      if (current === i) { current = -1; showCover('从下面的片单里选一个视频'); $('now').textContent = ''; }
      else if (current > i) current--;
      save(KEY, items); render();
      return;
    }
    btn.dataset.armed = '1';
    btn.textContent = '确认删除';
    setTimeout(function () { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = '删除'; } }, 3000);
  }

  function showCover(text, withNext) {
    var p = $('player');
    var f = p.querySelector('iframe');
    if (f) f.remove();
    var c = $('cover');
    c.hidden = false;
    $('coverText').textContent = text;
    var old = c.querySelector('button');
    if (old) old.remove();
    if (withNext && current + 1 < items.length) {
      var b = document.createElement('button');
      b.className = 'primary';
      b.textContent = '播放下一个';
      b.onclick = function () { play(current + 1); };
      c.appendChild(b);
    }
  }

  function play(i) {
    current = i;
    var it = items[i];
    var params = 'rel=0&playsinline=1&modestbranding=1&iv_load_policy=3&enablejsapi=1&autoplay=1&origin=' + encodeURIComponent(location.origin);
    var src = it.kind === 'playlist'
      ? 'https://' + host + '/embed/videoseries?list=' + it.id + '&' + params
      : 'https://' + host + '/embed/' + it.id + '?' + params;
    var p = $('player');
    var old = p.querySelector('iframe');
    if (old) old.remove();
    $('cover').hidden = true;
    var f = document.createElement('iframe');
    f.src = src;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.onload = function () {
      // 让播放器把状态发回来，用来在播完时盖住片尾推荐
      try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {}
    };
    p.appendChild(f);
    $('now').textContent = it.title || it.id;
    render();
    $('player').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  window.addEventListener('message', function (e) {
    if (!/youtube(-nocookie)?\.com$/.test(new URL(e.origin).hostname)) return;
    var d;
    try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!d) return;
    var state = d.event === 'onStateChange' ? d.info : (d.info && d.info.playerState);
    var isPlaylist = current >= 0 && items[current] && items[current].kind === 'playlist';
    if (state === 0 && !isPlaylist) showCover('已看完', true);
  });

  $('add').onclick = function () {
    var lines = $('input').value.split(/\n+/);
    var added = 0, bad = 0, dup = 0;
    lines.forEach(function (l) {
      if (!l.trim()) return;
      var it = parse(l);
      if (!it) { bad++; return; }
      if (items.some(function (x) { return x.id === it.id; })) { dup++; return; }
      items.push(it); added++;
    });
    save(KEY, items); render();
    var parts = [];
    if (added) parts.push('已添加 ' + added + ' 个');
    if (dup) parts.push(dup + ' 个已在片单里');
    if (bad) parts.push(bad + ' 行不是 YouTube 链接，请检查');
    $('msg').textContent = parts.join('，') || '请先粘贴链接';
    if (added && !bad) $('input').value = '';
  };

  $('export').onclick = function () {
    var text = items.map(function (it) { return linkOf(it) + (it.title ? ' ' + it.title : ''); }).join('\n');
    var done = function () { $('msg').textContent = '已复制 ' + items.length + ' 条链接。存到备忘录里，需要时粘贴回来即可恢复。'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { $('input').value = text; $('input').select(); $('msg').textContent = '无法自动复制，已把链接放进输入框，请手动复制。'; });
    } else { $('input').value = text; $('input').select(); }
  };

  function setMode(h) {
    host = h; save(MODE_KEY, h);
    [$('modeA'), $('modeB')].forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.host === h)); });
    $('modeNote').textContent = '当前使用 ' + h + ' 播放。';
    if (current >= 0) play(current);
  }
  $('modeA').onclick = function () { setMode(this.dataset.host); };
  $('modeB').onclick = function () { setMode(this.dataset.host); };

  setMode(host);
  render();
})();
</script>
</body>
</html>
